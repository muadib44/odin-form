<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="main">
        <div class="sidebar">
            <div class="icon-container">
                <img src="./images/icon.png">
                <p>ODIN</p>
            </div>
            <div class="credits">
                <p>Photo by <a href="https://images.unsplash.com/photo-1534067783941-51c9c23ecefd?ixlib=rb-4.1.0&q=85&fm=jpg&crop=entropy&cs=srgb&dl=guillaume-briard-lSXpV8bDeMA-unsplash.jpg">Guillaume Briad</a> 
                    on <a href="https://unsplash.com/">Unsplash</a>
                </p>
            </div>
        </div>
        <div class="container">
            <div class="header-section">
                <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.<br>
                    Sign up <em>now</em> to get started.
                </p>
                <p>You <em>know</em> you want to.</p>
            </div>
            <div class="form-section">
                <form action="example.com/path" method="post">
                    <fieldset>
                        <legend>Let's do this!</legend>
                        
                        <div>
                            <label for="user_first-name">FIRST NAME</label>
                            <input type="text" id="user_first-name" name="first-name" required>
                        </div>
                        <div>
                            <label for="user_last-name">LAST NAME</label>
                            <input type="text" id="user_last-name" name="last-name">
                        </div>
                        <div>
                            <label for="user_email">EMAIL</label>
                            <input type="email" id="user_email" name="email" placeholder="you@example.com" required>
                        </div>
                        <div>
                            <label for="user_number">PHONE NUMBER</label>
                            <input type="tel" id="user_number" name="number" placeholder="(999) 999-9999" maxlength="10" required>
                        </div>
                        <div>
                            <label for="user_password">PASSWORD</label>
                            <input type="password" id="user_password" name="password" minlength="8" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" required>
                        </div>
                        <div>
                            <label for="user_confirm-password">CONFIRM PASSWORD</label>
                            <input type="password" id="user_confirm-password" name="confirm-password" minlength="8" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" required>
                        </div>
                    </fieldset>
                </form>
            </div>
            <div class="submission-section">
                <button type="submit">Create Account</button>
                <p>Already have an account? <a href=# target="_blank">Log in</a></p>
            </div>
        </div>
    </div>   
</body>
</html>
